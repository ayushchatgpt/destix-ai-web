<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Espresso -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161513" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>

    <!-- Bronze/Gold Metallic Gradient for Front Layers -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CC" />
      <stop offset="30%" stop-color="#E2C48E" />
      <stop offset="65%" stop-color="#B88746" />
      <stop offset="100%" stop-color="#8F5E24" />
    </linearGradient>

    <!-- Deep Bronze Gradient for Recessed Diagonal -->
    <linearGradient id="bronzeDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#9E6B28" />
      <stop offset="100%" stop-color="#6E4413" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC08A" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#B88746" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#553A17" stop-opacity="0.25" />
    </linearGradient>

    <!-- Neural Beacon Radial Glow -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="1" />
      <stop offset="35%" stop-color="#00F5A0" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00F5A0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0" />
    </radialGradient>

    <!-- Mask for architectural gap where X strokes cross -->
    <mask id="xCrossMask">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      <polygon points="360,132 426,132 292,380 226,380" fill="#000000" />
    </mask>
  </defs>

  <!-- Squircle Base with Champagne Bronze Bezel -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner Hairline Border -->
  <rect x="34" y="34" width="444" height="444" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Architectural Crosshair Coordinate Markers -->
  <line x1="256" y1="36" x2="256" y2="52" stroke="#DFC08A" stroke-opacity="0.4" stroke-width="2" />
  <line x1="256" y1="460" x2="256" y2="476" stroke="#DFC08A" stroke-opacity="0.4" stroke-width="2" />
  <line x1="36" y1="256" x2="52" y2="256" stroke="#DFC08A" stroke-opacity="0.4" stroke-width="2" />
  <line x1="460" y1="256" x2="476" y2="256" stroke="#DFC08A" stroke-opacity="0.4" stroke-width="2" />

  <!-- ================= MONOGRAM DX ================= -->
  <g id="destix-monogram">
    <!-- LETTER D -->
    <path d="
      M 92,144
      L 146,144
      C 192,144 242,168 242,256
      C 242,344 192,368 146,368
      L 92,368
      Z
      M 144,196
      L 144,316
      C 168,316 190,302 190,256
      C 190,210 168,196 144,196
      Z
    " fill="url(#goldMetallic)" fill-rule="evenodd" />

    <!-- LETTER X - STROKE 1 (Descending \) with gap mask -->
    <g mask="url(#xCrossMask)">
      <polygon points="258,144 310,144 420,368 368,368" fill="url(#bronzeDeep)" />
    </g>

    <!-- LETTER X - STROKE 2 (Ascending //) floating cleanly on top -->
    <polygon points="368,144 420,144 310,368 258,368" fill="url(#goldMetallic)" />
  </g>

  <!-- ================= NEURAL TELEMETRY BEACON ================= -->
  <circle cx="420" cy="92" r="32" fill="url(#emeraldAura)" />
  <circle cx="420" cy="92" r="14" fill="#00F5A0" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="417" cy="89" r="4.5" fill="#FFFFFF" opacity="0.9" />
</svg>